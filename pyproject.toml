[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recserve"
version = "0.1.0"
description = "Two-stage (retrieval + ranking) movie recommendation service on MovieLens 25M"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26,<2.3",
    "pandas>=2.2,<3",
    "pyarrow>=15",
    "scipy>=1.12",
    "pyyaml>=6",
    "truststore>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
train = ["torch>=2.4", "faiss-cpu>=1.8"]

[tool.setuptools.packages.find]
include = ["recserve*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "smoke: end-to-end pipeline test on synthetic data",
]
