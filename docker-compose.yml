# Serving stack. Prerequisites (see README): data/split from `make split` and
# artifacts/serving/ml-25m from `make serving-artifacts`.
services:
  redis:
    image: redis:7.4.1-alpine
    # Cache only: user state is reloaded by `loader` on every start.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  loader:
    build: .
    command: ["python", "-m", "recserve.serving.load_redis", "--set", "paths.split_dir=/data/split"]
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./data/split:/data/split:ro
    depends_on:
      redis: {condition: service_healthy}

  api:
    build: .
    command: ["serve"]
    environment:
      RECSERVE_ARTIFACTS: /artifacts/serving/ml-25m
      REDIS_URL: redis://redis:6379/0
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
      RECSERVE_CANDIDATES: ${RECSERVE_CANDIDATES:-}
      RECSERVE_FILTER: ${RECSERVE_FILTER:-}
    volumes:
      - ./artifacts/serving:/artifacts/serving:ro
    ports: ["${API_PORT:-8000}:8000"]
    depends_on:
      redis: {condition: service_healthy}
      loader: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 5s
      retries: 30

  prometheus:
    image: prom/prometheus:v2.53.2
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["${PROMETHEUS_PORT:-9090}:9090"]
    depends_on: [api]

  grafana:
    image: grafana/grafana:11.2.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["${GRAFANA_PORT:-3000}:3000"]
    depends_on: [prometheus]
