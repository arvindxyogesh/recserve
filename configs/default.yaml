# Full MovieLens 25M run. Every script takes --config; all randomness is seeded from `seed`.
seed: 42

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  split_dir: data/split
  results_dir: results
  artifacts_dir: artifacts

data:
  dataset: ml-25m
  url: https://files.grouplens.org/datasets/movielens/ml-25m.zip
  md5_url: https://files.grouplens.org/datasets/movielens/ml-25m.zip.md5
  keep_raw: false            # delete the zip after Parquet conversion (CSVs are never extracted)
  positive_threshold: 4.0    # rating >= 4.0 is a positive interaction
  sample_users: null         # int to subsample users for quick dev runs

split:
  # Global temporal split: cutoffs are quantiles of the timestamp of ALL ratings.
  # train: ts < t_val, val: t_val <= ts < t_test, test: ts >= t_test
  val_quantile: 0.90
  test_quantile: 0.95

eval:
  retrieval_ks: [50, 100, 200]
  ranking_k: 10
  max_eval_users: null       # int to subsample evaluation users (seeded)
  batch_size: 2048

baselines:
  popularity_recent_days: 90  # window (before the split cutoff) for recent popularity
  cooccurrence:
    max_history: 200          # most recent positives per user used to build co-occurrence
    top_neighbors: 200        # neighbours kept per item
    shrinkage: 10.0           # cosine shrinkage for rarely co-occurring pairs
    min_item_positives: 5     # items with fewer train positives get no neighbour list

two_tower:
  emb_dim: 64
  hidden: 256
  dropout: 0.1
  history_len: 50           # most recent positives fed to the user tower
  batch_size: 4096          # also the number of in-batch negatives per example
  epochs: 5                 # max; the val run picks the best epoch, the test run reuses it
  lr: 0.001
  weight_decay: 0.0
  temperature: 0.05
  logq_correction: true
  use_genome: true
  device: auto              # cuda > mps > cpu
  eval_users_per_epoch: 3000
  benchmark_steps: null     # int: time this many steps and exit

ann:
  k: 100                    # candidates retrieved per request
  hnsw_m: [16, 32]          # graph degree
  ef_construction: 200
  ef_search: [32, 64, 128, 256]
  latency_queries: 2000     # sampled warm test users, one query at a time
  threads: 1                # per-request latency is single-threaded

ranker:
  candidates: 100           # retrieved per user, then re-ranked
  history_len: 50           # recent positives used for profile features
  valid_frac: 0.2           # val users held out for early stopping
  num_boost_round: 2000
  early_stopping_rounds: 100
  params:
    objective: lambdarank
    metric: ndcg
    eval_at: [10]
    lambdarank_truncation_level: 20
    learning_rate: 0.05
    num_leaves: 31
    min_data_in_leaf: 50
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 1
    deterministic: true
    force_row_wise: true
    verbose: -1

serving:
  candidates: 100           # retrieved by HNSW, re-ranked by LambdaRank
  ann_m: 16                 # chosen in M2: 98% overlap with exact at efSearch 128
  ef_construction: 200
  ef_search: 128            # raised per query to cover over-fetch for seen items
  max_search: 2048          # cap on k + |seen| fetched from the index
  filter_mode: overfetch    # overfetch | selector (see recserve/serving/recommender.py)
  cold_start_pool: 500      # popular items kept per genre list
  redis_url: redis://localhost:6379/0
  max_users: null           # int to load only the first N users into Redis

probe:
  url: http://localhost:8000
  requests: 1000
  k: 10

load_test:
  label: baseline            # names the result files
  host: http://localhost:8000
  prometheus: http://localhost:9090
  target_rps: [50, 100, 200, 400, 600, 800, 1000, 1200, 1500, 2000, 2500, 3000]
  # Each locust user models one upstream caller with a pooled connection. At the
  # same total rate, many slow connections (e.g. 80 x 5 req/s) gave much higher
  # server-side latency than few busy ones (20 x 20 req/s); see results/ and README.
  per_user_rps: 20
  step_seconds: 45
  locust_processes: 4
  n_user_ids: 50000          # random userIds requested (about 4% are cold start)
  p99_budget_ms: 50
  stop_after_failures: 2     # stop after this many unsustained steps
  prometheus_scrape_wait_s: 6
  cooldown_s: 10             # idle time between steps so queues drain
  environment_note: >-
    locust runs in the loadgen container on the compose network (no host port
    forwarding), pinned to Docker VM vCPUs 5-9; the API is pinned to vCPUs 0-3
    and Redis to vCPU 4; all inside one Docker Desktop VM on the same host
