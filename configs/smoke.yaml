# Tiny synthetic dataset for the CI smoke test (python -m recserve.data.synthetic).
seed: 42

paths:
  raw_dir: data/smoke/raw
  processed_dir: data/smoke/processed
  split_dir: data/smoke/split
  results_dir: data/smoke/results
  artifacts_dir: data/smoke/artifacts

data:
  dataset: synthetic
  positive_threshold: 4.0
  sample_users: null
  synthetic:
    n_users: 400
    n_items: 300
    ratings_per_user: 40

split:
  val_quantile: 0.80
  test_quantile: 0.90

eval:
  retrieval_ks: [50, 100, 200]
  ranking_k: 10
  max_eval_users: null
  batch_size: 256

baselines:
  popularity_recent_days: 30
  cooccurrence:
    max_history: 200
    top_neighbors: 50
    shrinkage: 10.0
    min_item_positives: 2

two_tower:
  emb_dim: 16
  hidden: 32
  dropout: 0.0
  history_len: 10
  batch_size: 256
  epochs: 2
  lr: 0.005
  weight_decay: 0.0
  temperature: 0.1
  logq_correction: true
  use_genome: true
  device: cpu
  eval_users_per_epoch: 100
  benchmark_steps: null

ann:
  k: 50
  hnsw_m: [8]
  ef_construction: 200
  ef_search: [16, 64]
  latency_queries: 50
  threads: 1
