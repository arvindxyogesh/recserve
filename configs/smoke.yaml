# Tiny synthetic dataset for the CI smoke test (python -m recserve.data.synthetic).
seed: 42

paths:
  raw_dir: data/smoke/raw
  processed_dir: data/smoke/processed
  split_dir: data/smoke/split
  results_dir: data/smoke/results
  artifacts_dir: data/smoke/artifacts

data:
  dataset: synthetic
  positive_threshold: 4.0
  sample_users: null
  synthetic:
    n_users: 400
    n_items: 300
    ratings_per_user: 40

split:
  val_quantile: 0.80
  test_quantile: 0.90

eval:
  retrieval_ks: [50, 100, 200]
  ranking_k: 10
  max_eval_users: null
  batch_size: 256

baselines:
  popularity_recent_days: 30
  cooccurrence:
    max_history: 200
    top_neighbors: 50
    shrinkage: 10.0
    min_item_positives: 2

two_tower:
  emb_dim: 16
  hidden: 32
  dropout: 0.0
  history_len: 10
  batch_size: 256
  epochs: 2
  lr: 0.005
  weight_decay: 0.0
  temperature: 0.1
  logq_correction: true
  use_genome: true
  device: cpu
  eval_users_per_epoch: 100
  benchmark_steps: null

ann:
  k: 50
  hnsw_m: [8]
  ef_construction: 200
  ef_search: [16, 64]
  latency_queries: 50
  threads: 1

ranker:
  candidates: 50
  history_len: 50           # recent positives used for profile features
  valid_frac: 0.2           # val users held out for early stopping
  num_boost_round: 50
  early_stopping_rounds: 10
  params:
    objective: lambdarank
    metric: ndcg
    eval_at: [10]
    lambdarank_truncation_level: 20
    learning_rate: 0.05
    num_leaves: 31
    min_data_in_leaf: 5
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 1
    deterministic: true
    force_row_wise: true
    verbose: -1

serving:
  candidates: 50
  ann_m: 16                 # chosen in M2: 98% overlap with exact at efSearch 128
  ef_construction: 200
  ef_search: 128            # raised per query to cover over-fetch for seen items
  max_search: 2048          # cap on k + |seen| fetched from the index
  filter_mode: overfetch    # overfetch | selector (see recserve/serving/recommender.py)
  cold_start_pool: 500      # popular items kept per genre list
  redis_url: redis://localhost:6379/0
  max_users: null           # int to load only the first N users into Redis

probe:
  url: http://localhost:8000
  requests: 1000
  k: 10

load_test:
  label: baseline            # names the result files
  host: http://localhost:8000
  prometheus: http://localhost:9090
  target_rps: [50, 100, 200, 400, 600, 800, 1000, 1200, 1500, 2000, 2500, 3000]
  # Each locust user models one upstream caller with a pooled connection. At the
  # same total rate, many slow connections (e.g. 80 x 5 req/s) gave much higher
  # server-side latency than few busy ones (20 x 20 req/s); see results/ and README.
  per_user_rps: 20
  step_seconds: 45
  locust_processes: 4
  n_user_ids: 50000          # random userIds requested (about 4% are cold start)
  p99_budget_ms: 50
  stop_after_failures: 2     # stop after this many unsustained steps
  prometheus_scrape_wait_s: 6
  environment_note: >-
    locust runs in the loadgen container on the compose network (no host port
    forwarding), pinned to Docker VM vCPUs 5-9; the API is pinned to vCPUs 0-3
    and Redis to vCPU 4; all inside one Docker Desktop VM on the same host
